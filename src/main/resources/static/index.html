<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 【改动】更新标题，使其更符合项目定位 -->
    <title>AI 编程助手</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        /* ... 其他样式保持不变 ... */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        textarea { min-height: 44px; max-height: 200px; transition: height 0.2s; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .typing-cursor::after { content: "|"; animation: blink 1s step-end infinite; }
        @keyframes blink { from, to { opacity: 1; } 50% { opacity: 0; } }

        /* 【新增】为文件上传按钮添加样式 */
        .file-input-label {
            cursor: pointer;
        }
        .file-input {
            display: none;
        }
    </style>
</head>
<body>
<div id="app" class="flex flex-col h-screen bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm py-3 px-4 flex items-center justify-between">
        <div class="flex items-center">
            <!-- 【改动】更新标题 -->
            <div class="text-xl font-bold text-blue-600">AI 编程助手</div>
        </div>
        <div class="flex items-center space-x-3">
            <button
                    @click="startNewConversation"
                    class="ml-2 p-3 rounded-lg bg-green-500 hover:bg-green-600 text-white" title="新会话">
                <i class="fas fa-plus"></i>
            </button>
            <button @click="toggleDarkMode" class="p-2 rounded-full hover:bg-gray-100" title="切换模式">
                <i :class="darkMode ? 'fas fa-moon text-gray-600' : 'fas fa-sun text-gray-600'"></i>
            </button>
        </div>
    </header>

    <!-- 聊天内容区域 -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6" ref="chatContainer" :class="{ 'bg-gray-800': darkMode }">
        <!-- ... 聊天消息的v-for循环保持不变 ... -->
        <div v-for="(message, index) in messages" :key="index" class="max-w-3xl mx-auto">
            <div :class="['flex', message.role === 'user' ? 'justify-end' : 'justify-start']">
                <div :class="['flex items-start space-x-3', message.role === 'user' ? 'flex-row-reverse space-x-reverse' : '']">
                    <div :class="['w-8 h-8 rounded-full flex items-center justify-center', message.role === 'user' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600', darkMode && message.role === 'assistant' ? 'bg-gray-700 text-green-400' : '']">
                        <i :class="message.role === 'user' ? 'fas fa-user' : 'fas fa-robot'"></i>
                    </div>
                    <div :class="['p-3 rounded-lg max-w-lg', message.role === 'user' ? 'bg-blue-500 text-white' : darkMode ? 'bg-gray-700 text-gray-100 border-gray-600' : 'bg-white shadow border border-gray-100']">
                        <div v-if="message.role === 'assistant' && message.isLoading" class="flex space-x-2">
                            <div :class="['w-2 h-2 rounded-full', darkMode ? 'bg-gray-400' : 'bg-gray-300', 'animate-pulse']"></div>
                            <div :class="['w-2 h-2 rounded-full', darkMode ? 'bg-gray-400' : 'bg-gray-300', 'animate-pulse delay-100']"></div>
                            <div :class="['w-2 h-2 rounded-full', darkMode ? 'bg-gray-400' : 'bg-gray-300', 'animate-pulse delay-200']"></div>
                        </div>
                        <div v-else class="whitespace-pre-wrap" v-html="message.content"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 输入框区域 -->
    <footer :class="['border-t p-4', darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200']">
        <div class="max-w-3xl mx-auto relative">
            <div class="flex items-center">
                <!-- 【新增】文件上传按钮 -->
                <label for="file-upload" class="file-input-label mr-2 p-3 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-600" title="上传项目.zip文件">
                    <i class="fas fa-paperclip"></i>
                </label>
                <input id="file-upload" type="file" class="file-input" @change="handleFileUpload" accept=".zip">

                <textarea
                        v-model="userInput"
                        @keydown.enter.exact.prevent="sendMessage"
                        placeholder="请先上传项目文件，然后在此输入问题..."
                        :class="['flex-1 border rounded-lg py-3 px-4 focus:outline-none focus:ring-2 resize-none', darkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 placeholder-gray-400' : 'border-gray-300 focus:ring-blue-500 focus:border-transparent']"
                        rows="1"
                        ref="textarea"
                        @input="adjustTextareaHeight"
                ></textarea>

                <button
                        @click="sendMessage"
                        :disabled="!userInput.trim() || isLoading"
                        :class="['ml-2 p-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed']"
                >
                    <i :class="isLoading ? 'fas fa-stop' : 'fas fa-paper-plane'"></i>
                </button>
            </div>
        </div>
    </footer>
</div>

<script>
    const {createApp, ref, nextTick, onMounted} = Vue;

    createApp({
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isLoading = ref(false);
            const chatContainer = ref(null);
            const textarea = ref(null);
            const darkMode = ref(false);

            // 【改动】我们现在用 sessionId 来管理整个会话状态
            const sessionId = ref(null);
            let controller = null;

            // ... adjustTextareaHeight 和 scrollToBottom 方法保持不变 ...
            const adjustTextareaHeight = () => {
                const el = textarea.value;
                el.style.height = 'auto';
                el.style.height = `${el.scrollHeight}px`;
            };
            const scrollToBottom = () => {
                nextTick(() => {
                    chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                });
            };

            const toggleDarkMode = () => {
                darkMode.value = !darkMode.value;
                localStorage.setItem('darkMode', darkMode.value);
            };

            // 【改动】新建会话现在也需要重置 sessionId
            const startNewConversation = () => {
                messages.value = [];
                sessionId.value = null; // 重置会话ID
                addAssistantMessage('您好！我是AI编程助手，请上传一个.zip格式的项目文件开始分析。');
            };

            // 辅助函数：用于向聊天窗口添加助手消息
            const addAssistantMessage = (content, isLoading = false) => {
                messages.value.push({
                    role: 'assistant',
                    content: content,
                    isLoading: isLoading
                });
                scrollToBottom();
            };

            // 【新增】处理文件上传的核心逻辑
            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                // 开始一个新的会話
                startNewConversation();
                addAssistantMessage(`正在上传并分析项目: <strong>${file.name}</strong>...`, true);

                const formData = new FormData();
                formData.append('file', file);

                isLoading.value = true;

                try {
                    const response = await fetch('/upload-project', {
                        method: 'POST',
                        body: formData,
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || '文件上传失败');
                    }

                    // 上传成功后，从后端获取并保存 sessionId
                    sessionId.value = result.sessionId;

                    // 更新UI提示
                    messages.value.pop(); // 移除"正在上传"的消息
                    addAssistantMessage(`项目 <strong>${file.name}</strong> 分析完成！<br>会话ID: <strong>${sessionId.value}</strong><br>您现在可以开始提问了。`);

                } catch (error) {
                    messages.value.pop();
                    addAssistantMessage(`错误: ${error.message}`);
                    console.error('上传失败:', error);
                } finally {
                    isLoading.value = false;
                    // 清空文件输入框，以便可以再次上传同一个文件
                    event.target.value = '';
                }
            };

            // 【改动】发送消息的逻辑，以匹配新的后端 /chat 接口
            const sendMessage = async () => {
                const messageContent = userInput.value.trim();
                if (!messageContent || isLoading.value) return;

                // 检查是否已经上传了文件并获得了sessionId
                if (!sessionId.value) {
                    addAssistantMessage('请先上传一个项目文件，然后再进行提问。');
                    return;
                }

                messages.value.push({ role: 'user', content: messageContent });
                userInput.value = '';
                adjustTextareaHeight();
                scrollToBottom();

                const assistantMessageRef = { role: 'assistant', content: '', isLoading: true };
                messages.value.push(assistantMessageRef);
                scrollToBottom();

                isLoading.value = true;
                controller = new AbortController();

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: messageContent,
                            sessionId: sessionId.value,
                        }),
                        signal: controller.signal,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        assistantMessageRef.content += chunk;
                        assistantMessageRef.isLoading = false;
                        scrollToBottom();
                    }

                } catch (error) {
                    if (error.name !== 'AbortError') {
                        assistantMessageRef.content = `抱歉，请求出错: ${error.message}`;
                    }
                } finally {
                    assistantMessageRef.isLoading = false;
                    isLoading.value = false;
                    controller = null;
                }
            };

            onMounted(() => {
                darkMode.value = localStorage.getItem('darkMode') === 'true';
                startNewConversation();
            });

            return {
                messages,
                userInput,
                isLoading,
                darkMode,
                chatContainer,
                textarea,
                sendMessage,
                toggleDarkMode,
                adjustTextareaHeight,
                startNewConversation,
                handleFileUpload
            };
        }
    }).mount('#app');
</script>
</body>
</html>
